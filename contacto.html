<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto · Miga & Azúcar</title>
  <meta name="description" content="Datos de contacto de ejemplo.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2e5b5a">
  <link rel="preload" href="assets/fonts/Fraunces-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/InstrumentSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="contacto">
  <div data-site-header></div>
  <main id="contenido">
    <section class="page-head"><div class="container stack-md"><p class="eyebrow">Contacto</p><h1 class="h1">Visítanos o escríbenos</h1></div></section>
    <section class="section">
      <div class="container split">
        <dl class="info-list split__text">
          <div><dt>Dirección</dt><dd>Calle Ejemplo 123, Centro, Puebla, Pue.</dd></div>
          <div><dt>WhatsApp</dt><dd><a href="#" data-wa-demo="Hola Miga &amp; Azúcar.">222 000 0000</a></dd></div>
          <div><dt>Teléfono</dt><dd>222 000 0000</dd></div>
          <div><dt>Horario</dt><dd>Martes a sábado 10:00 – 19:00<br>Domingo 11:00 – 16:00</dd></div>
        </dl>
        <form class="quote-form" data-wa-form data-wa-intro="Hola Miga &amp; Azúcar." novalidate>
          <h3 class="h3">Formulario de contacto</h3>
          <div class="form-row">
            <div class="field"><label for="c-nombre">Nombre</label><input id="c-nombre" name="nombre" type="text" autocomplete="name" placeholder="Tu nombre"></div>
            <div class="field"><label for="c-tel">Teléfono</label><input id="c-tel" name="telefono" type="tel" autocomplete="tel" placeholder="222 000 0000"></div>
          </div>
          <div class="field">
            <label for="c-correo">Correo electrónico*</label>
            <input id="c-correo" name="correo" type="email" autocomplete="email" placeholder="tu@correo.com" required aria-describedby="c-correo-error">
            <p class="field__error" id="c-correo-error" hidden>Escribe un correo válido.</p>
          </div>
          <div class="field"><label for="c-mensaje">¿Qué nos quieres decir?</label><textarea id="c-mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje"></textarea></div>
          <div class="quote-form__actions">
            <button class="btn btn--primary" type="submit">Enviar por WhatsApp</button>
            <p class="caption">Te mostraremos el mensaje listo para enviar.</p>
          </div>
        </form>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
